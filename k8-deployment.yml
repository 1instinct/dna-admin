apiVersion: apps/v1
kind: Deployment
metadata:
  name: dna-admin
  namespace: default
  labels:
    app: dna-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dna-admin
  template:
    metadata:
      labels:
        app: dna-admin
    spec:
      containers:
        - name: dna-admin
          image: localhost:32000/dna-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_SERVE_STATIC_FILES
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
          envFrom:
            - secretRef:
                name: dna-admin-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: default
  labels:
    app: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      nodeSelector:
        storage-type: ssd
        role: database
      containers:
        - name: db
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dna-admin-secrets
                  key: DATABASE_PASS
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dna-admin-secrets
                  key: DATABASE_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dna-admin-secrets
                  key: DATABASE_NAME
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: db-data
          hostPath:
            path: /data/postgres
            type: DirectoryOrCreate
